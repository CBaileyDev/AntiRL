[package]
name = "replay-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
boxcars = "=0.12.0"
subtr-actor = "=1.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "antirl-replay"
path = "src/main.rs"
